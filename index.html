<style>
:root {
  --papel-kraft: #CDB48F;
  --papel-claro: #EFE9DD;
  --papel-velho: #D9CDB8;
  --tinta: #14110F;
  --grafite-1: #2E2E2E;
  --grafite-2: #6B6B6B;
  --grafite-3: #A8A8A8;
  --grafite-4: #D9D9D9;
  --tecido-preto: #0E0E10;
  --amarelo: #F2C230;
  --amarelo-escuro: #C98F12;
  --azul-cabelo: #1E3A6E;
  --azul-vivo: #2F5BD6;
  --rosa: #F2A6B8;
  --laranja: #F08A24;
  --vinho: #7A2E3E;
  --lilas: #7C6BC4;

  --cor: 0;
  --fio: #14110F;
  --mao: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #070606;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  height: 100vh;
  height: 100dvh;
  background: radial-gradient(ellipse at 50% 40%, #1d1916 0%, #070606 70%);
  color: var(--tinta);
  font-family: var(--mao);
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-touch-callout: none;
}

#palco {
  position: relative;
  width: min(100vw, calc(100vh * 0.62));
  width: min(100vw, calc(100dvh * 0.62));
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  background: var(--tecido-preto);
  box-shadow: 0 0 80px rgba(0, 0, 0, .8);
  isolation: isolate;
}

#cenas { position: absolute; inset: 0; background: #000; }

.cena {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background-size: cover;
}

.cena > svg.arte,
.cena > canvas.tela {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

.cinza svg.arte.filtro { filter: saturate(var(--cor)); }
.colorido .cinza svg.arte.filtro { filter: none; }

svg .toque { cursor: pointer; }

/* papel e atmosfera */
.ruido {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: var(--ruido-papel);
  background-size: 256px 256px;
  mix-blend-mode: multiply;
  opacity: .22;
}

#grao {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-size: 160px 160px;
  opacity: .085;
  z-index: 30;
}

#vinheta {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0, 0, 0, .55) 100%);
  z-index: 31;
}

.trama {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 3px);
}

/* camada com a mesma caixa da arte (360x640) */
.sobre {
  position: absolute;
  pointer-events: none;
  font-size: calc(var(--k, 1) * 16px);
}
.sobre > * { pointer-events: auto; }

/* cartão de mensagem */
#cartao {
  position: absolute;
  left: 50%;
  bottom: calc(52px + env(safe-area-inset-bottom));
  width: min(90%, 340px);
  padding: 15px 18px 16px;
  background: var(--papel-claro);
  border: 9px solid transparent;
  border-image: repeating-linear-gradient(45deg, #3d3b39 0 7px, #ebe7e0 7px 14px) 9;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .38);
  font-family: var(--mao);
  font-size: clamp(17px, 4.9vw, 24px);
  line-height: 1.38;
  color: var(--tinta);
  text-align: center;
  transform: translate(-50%, 14px) rotate(var(--rot, 0deg));
  opacity: 0;
  transition: opacity .4s ease, transform .5s ease;
  pointer-events: none;
  z-index: 20;
}
#cartao::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1.5px dashed rgba(20, 17, 15, .42);
  pointer-events: none;
}
#cartao.on {
  opacity: 1;
  transform: translate(-50%, 0) rotate(var(--rot, 0deg));
}
#cartao .l { opacity: 0; transition: opacity .22s; }
#cartao .l.v { opacity: 1; }
#cartao .ult {
  background-image: linear-gradient(var(--fio), var(--fio));
  background-repeat: no-repeat;
  background-position: 0 92%;
  background-size: 0% 2px;
  transition: background-size .6s ease;
}
#cartao.pronto .ult { background-size: 100% 2px; }
#cartao.bilhete { font-size: clamp(16px, 4.4vw, 21px); }

/* controles */
.ui { position: absolute; z-index: 40; }

#controles {
  top: calc(10px + env(safe-area-inset-top));
  right: 10px;
  display: flex;
  gap: 8px;
  transition: opacity .4s;
}
#controles.oculto { opacity: 0; pointer-events: none; }
#controles button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1.5px dashed rgba(239, 233, 221, .55);
  background: rgba(14, 14, 16, .42);
  color: #EFE9DD;
  font: 20px/1 var(--mao);
  display: grid;
  place-items: center;
  cursor: pointer;
  -webkit-backdrop-filter: blur(2px);
  backdrop-filter: blur(2px);
}
#controles button svg { width: 20px; height: 20px; }

#progresso {
  left: 18px;
  right: 18px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  height: 26px;
  pointer-events: none;
  transition: opacity .5s;
}
#progresso.oculto { opacity: 0; }
#progresso svg { width: 100%; height: 100%; overflow: visible; }

#aviso {
  left: 50%;
  top: calc(64px + env(safe-area-inset-top));
  transform: translateX(-50%);
  padding: 8px 14px;
  background: var(--papel-claro);
  border: 1.5px dashed var(--tinta);
  font: 15px var(--mao);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .4s;
  pointer-events: none;
}
#aviso.on { opacity: 1; }

.gravando #controles,
.gravando #aviso { display: none; }

/* cena 0 */
.t0-para {
  position: absolute;
  left: 0; right: 0;
  top: 73%;
  text-align: center;
  font-size: 2em;
  color: var(--papel-claro);
  text-shadow: 0 2px 6px rgba(0, 0, 0, .5);
}
.t0-dica {
  position: absolute;
  left: 0; right: 0;
  top: 82%;
  text-align: center;
  font-size: 1.05em;
  color: rgba(239, 233, 221, .8);
  animation: pulsar 2.2s ease-in-out infinite;
  transition: opacity .4s;
}
.t0-dica.off { opacity: 0; animation: none; }
.t0-egg {
  position: absolute;
  left: 50%;
  top: 9%;
  transform: translateX(-50%) rotate(-3deg);
  padding: .3em .8em;
  font-size: 1.7em;
  color: var(--tinta);
  background: var(--papel-claro);
  border: 2px dashed var(--tinta);
  outline: 6px solid var(--papel-claro);
  white-space: nowrap;
  clip-path: inset(0 100% 0 0);
  transition: clip-path 1.4s steps(10);
}
.t0-egg.on { clip-path: inset(0 0 0 0); }

@keyframes pulsar { 50% { opacity: .35; } }

/* cena 11 */
.t11-titulo {
  position: absolute;
  left: 4%; right: 4%;
  top: 7.5%;
  text-align: center;
  font-size: 1.32em;
  line-height: 1.25;
  color: var(--tinta);
}
.t11-titulo span {
  border-bottom: 2px dashed var(--tinta);
  padding-bottom: 2px;
}
.t11-linha {
  position: absolute;
  left: 6%; right: 6%;
  top: 17.5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.t11-cont {
  font-size: 1.1em;
  padding: .1em .55em;
  border: 1.5px dashed var(--tinta);
  background: rgba(239, 233, 221, .7);
}
.t11-seguir {
  font: 1.05em var(--mao);
  color: var(--papel-claro);
  background: var(--tinta);
  border: 0;
  border-radius: 99px;
  padding: .45em 1em;
  min-height: 44px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s;
  cursor: pointer;
}
.t11-seguir.on { opacity: 1; pointer-events: auto; }

/* cena 14 */
.t14 {
  position: absolute;
  left: 5%; right: 5%;
  text-align: center;
  color: var(--tinta);
  line-height: 1.25;
}
.t14 .l { opacity: 0; transition: opacity .25s; }
.t14 .l.v { opacity: 1; }
.t14-a { top: 73%; font-size: 1.5em; }
.t14-b { top: 82.5%; font-size: 1.5em; }
.t14-c {
  top: 30%;
  font-size: 2.55em;
  font-weight: bold;
  text-shadow: 0 2px 0 rgba(255, 255, 255, .45);
}
.t14 .linha-ouro {
  display: block;
  height: 3px;
  margin: .25em auto 0;
  width: 70%;
  background: repeating-linear-gradient(90deg, var(--amarelo-escuro) 0 9px, transparent 9px 14px);
  transform: scaleX(var(--p, 0));
  transform-origin: left;
}

/* cena 15 */
.t15-topo {
  position: absolute;
  left: 0; right: 0;
  top: 7%;
  text-align: center;
  font-size: 1em;
  color: rgba(239, 233, 221, .78);
  pointer-events: none;
}
.t15-envelope {
  position: absolute;
  left: 50%;
  top: 41%;
  width: 11em;
  height: 7.2em;
  transform: translate(-50%, -50%) rotate(-2deg) scale(var(--s, 0));
  background: var(--papel-claro);
  border: 0;
  border-radius: 4px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  cursor: pointer;
  font: 1.05em var(--mao);
  color: var(--tinta);
  padding: 0;
  overflow: hidden;
}
.t15-envelope::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 55%;
  background: linear-gradient(to bottom right, transparent 49.5%, rgba(20, 17, 15, .18) 50%, transparent 51%),
              linear-gradient(to bottom left, transparent 49.5%, rgba(20, 17, 15, .18) 50%, transparent 51%);
}
.t15-envelope .selo {
  position: absolute;
  left: 50%; top: 52%;
  width: 2.6em; height: 2.6em;
  transform: translate(-50%, -50%);
}
.t15-envelope .rotulo {
  position: absolute;
  left: 0; right: 0; bottom: .45em;
  text-align: center;
}
.t15-rodape {
  position: absolute;
  left: 0; right: 0;
  bottom: 13.5%;
  display: flex;
  justify-content: center;
  gap: .7em;
  flex-wrap: wrap;
}
.t15-rodape button {
  font: .98em var(--mao);
  min-height: 44px;
  padding: .4em 1em;
  border-radius: 99px;
  border: 1.5px dashed rgba(242, 194, 48, .85);
  background: rgba(14, 14, 16, .6);
  color: #F7E4A8;
  cursor: pointer;
}
.t15-credito {
  position: absolute;
  left: 0; right: 0;
  bottom: 8.5%;
  text-align: center;
  font-size: .82em;
  color: rgba(239, 233, 221, .6);
  pointer-events: none;
}

.carta {
  position: absolute;
  inset: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));
  z-index: 35;
  background: var(--papel-claro);
  background-image: var(--ruido-papel);
  background-size: 256px;
  border: 10px solid transparent;
  border-image: repeating-linear-gradient(45deg, #3d3b39 0 7px, #ebe7e0 7px 14px) 10;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .65);
  transform: translateY(110%) rotate(1deg);
  transition: transform .8s cubic-bezier(.2, .9, .25, 1.05);
  display: flex;
  flex-direction: column;
}
.carta.on { transform: translateY(0) rotate(0deg); }
.carta .rolar {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 26px 22px 30px;
  font-size: clamp(17px, 4.6vw, 21px);
  line-height: 1.5;
  color: var(--tinta);
  -webkit-user-select: text;
  user-select: text;
}
.carta p {
  margin: 0 0 1em;
  opacity: 0;
  filter: blur(3px);
  transform: translateY(6px);
  transition: opacity 1.1s ease, filter 1.4s ease, transform 1.1s ease;
}
.carta p.v { opacity: 1; filter: blur(0); transform: none; }
.carta p.forte { font-weight: bold; font-size: 1.12em; }
.carta p.ass { text-align: right; font-style: italic; }
.carta .fechar {
  position: absolute;
  top: -6px; right: -6px;
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 0;
  background: var(--tinta);
  color: var(--papel-claro);
  font: 20px var(--mao);
  cursor: pointer;
}

/* cortina de botões (replay) */
.cortina {
  position: absolute;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  overflow: hidden;
}
.cortina svg { position: absolute; }

@media (prefers-reduced-motion: reduce) {
  .t0-dica { animation: none; }
  #cartao, .carta, .carta p { transition-duration: .3s; }
}

</style>

function resolver(s, extra) {
  let r = s.replaceAll("{{NOME}}", NOME).replaceAll("{{NOME_MAIUSCULO}}", NOME.toUpperCase());
  if (extra) for (const k in extra) r = r.replaceAll("{{" + k + "}}", extra[k]);
  return r;
}
function txt(chave, extra) { return resolver(TEXTOS[chave], extra); }

// ── base.js
// ─────────────────────────────────────────────────────────────
// Base: paleta, utilidades, gerador de traço "jeito Coraline"
// ─────────────────────────────────────────────────────────────
const C = {

function H(tag, at, pai) {

    if (k === "txt") e.textContent = at[k];
    else if (k === "class") e.className = at[k];

}

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const fase = (t, a, b) => clamp((t - a) / (b - a));

const eo = (p) => 1 - Math.pow(1 - p, 3);
const ei = (p) => p * p * p;
const voltaOut = (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const sino = (t, per, fas = 0) => Math.sin((t / per) * Math.PI * 2 + fas);
// "animação em twos": personagens a 12 fps
const q12 = (t) => Math.floor(t / 83.333) * 83.333;
const rad = (g) => (g * Math.PI) / 180;

function rng(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

const n1 = (n) => Math.round(n * 10) / 10;

    document.body.appendChild(s);
    _medidor = S("path", {}, s);
  }
  return _medidor;
}

// amostra um path (só comandos absolutos) em subcaminhos de pontos
function amostrar(d, passo = 4) {
  const subs = d.match(/M[^M]*/g) || [];
  const p = medidor();
  const out = [];
  for (const sd of subs) {
    p.setAttribute("d", sd);
    const L = p.getTotalLength();
    const n = Math.max(2, Math.ceil(L / passo));
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const q = p.getPointAtLength((L * i) / n);
      pts.push([q.x, q.y]);
    }
    out.push(pts);
  }
  return out;
}

// jitter determinístico: soma de 2 senos + ruído pequeno, ao longo da normal
function tremer(pts, amp, seed) {
  const r = rng(seed);
  const f1 = r() * 6.28, f2 = r() * 6.28, k1 = .035 + r() * .04, k2 = .11 + r() * .08;
  let s = 0;
  return pts.map((p, i) => {
    if (i > 0) s += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
    const a = pts[Math.min(i + 1, pts.length - 1)], b = pts[Math.max(i - 1, 0)];
    let nx = -(a[1] - b[1]), ny = a[0] - b[0];
    const l = Math.hypot(nx, ny) || 1;
    nx /= l; ny /= l;
    const o = amp * (Math.sin(s * k1 + f1) * .65 + Math.sin(s * k2 + f2) * .35 + (r() - .5) * .4);
    return [p[0] + nx * o, p[1] + ny * o];
  });
}

function suave(pts, fechar) {
  if (pts.length < 3) return "M" + pts.map(fp).join("L");
  let d = "M" + fp(pts[0]);
  for (let i = 1; i < pts.length - 1; i++) {
    const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2];
    d += "Q" + fp(pts[i]) + " " + fp(m);
  }
  d += "L" + fp(pts[pts.length - 1]);
  return fechar ? d + "Z" : d;
}

function rabisco(d, amp = 1.1, seed = 1, passo = 5) {
  return amostrar(d, passo).map((pts, i) => suave(tremer(pts, amp, seed + i * 31))).join("");
}

// contorno de um "tubo" com espessura variável (taper): dedos, galhos, unhas
function tubo(pts, w0, w1, seed = 1, amp = .6, curva = 1) {
  const n = pts.length, L = [], R = [];
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = pts[Math.min(i + 1, n - 1)], b = pts[Math.max(i - 1, 0)];
    let nx = -(a[1] - b[1]), ny = a[0] - b[0];
    const l = Math.hypot(nx, ny) || 1;
    nx /= l; ny /= l;
    const u = i / (n - 1);
    const w = Math.max(.3, lerp(w0, w1, Math.pow(u, curva)) / 2 + (r() - .5) * amp);
    L.push([pts[i][0] + nx * w, pts[i][1] + ny * w]);
    R.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  return suave(L.concat(R.reverse()), true);
}
function tuboD(d, w0, w1, seed, amp, curva, passo = 4) {
  return tubo(amostrar(d, passo)[0], w0, w1, seed, amp, curva);
}

// linha de nanquim com traço duplo
function traco(pai, d, o = {}) {
  const g = S("g", {}, pai);
  const cor = o.cor || C.tinta, w = o.w || 2, amp = o.amp ?? 1.1, seed = o.seed || 1;
  const base = { fill: "none", stroke: cor, "stroke-linecap": "round", "stroke-linejoin": "round" };
  S("path", { ...base, d: rabisco(d, amp, seed, o.passo), "stroke-width": w }, g);
  if (o.duplo !== false) {
    S("path", { ...base, d: rabisco(d, amp * 1.15, seed + 7, o.passo), "stroke-width": w * .5, opacity: .55, transform: `translate(${o.dx ?? .9},${o.dy ?? .7})` }, g);
  }
  return g;
}

// forma preenchida com contorno tremido
function forma(pai, d, fill, o = {}) {

// anel irregular (túnel, poço, ondas da lua): nunca redondo, nunca concêntrico
function anelIrregular(rx, ry, seed, o = {}) {
  const r = rng(seed);
  const n = o.n || 84, amp = o.amp ?? .05, quad = o.quad ?? .3, voltas = o.voltas ?? 1.07;
  const f0 = r() * 6.28, f1 = r() * 6.28, f2 = r() * 6.28;
  const k1 = 2 + Math.floor(r() * 3), k2 = 5 + Math.floor(r() * 4);
  const p = 2 + quad * 6;
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    const th = f0 + Math.PI * 2 * voltas * u;
    const c = Math.cos(th), s = Math.sin(th);
    const sq = 1 / Math.pow(Math.pow(Math.abs(c), p) + Math.pow(Math.abs(s), p), 1 / p);
    const m = 1 + amp * (Math.sin(th * k1 + f1) * .6 + Math.sin(th * k2 + f2) * .4) + (r() - .5) * amp * .5;
    const g = 1 + (o.cresce ?? .045) * u;
    pts.push([rx * c * sq * m * g, ry * s * sq * m * g]);
  }
  return pts;
}

// escreve "Coraline" com o "o" sendo um botão; devolve função de progresso
function tituloCoraline(pai, cx, topo, esc, cor = C.tinta, furo) {
  const letras = ["C", "o", "r", "a", "l", "i", "n", "e"];
  const esp = 5;
  const larg = letras.reduce((s, l) => s + (l === "o" ? 40 : GLIFOS[l].w) + esp, -esp) * esc;
  let x = cx - larg / 2;
  const itens = [];
  letras.forEach((l, i) => {
    const g = S("g", { transform: `translate(${n1(x)},${topo}) scale(${esc})` }, pai);
    if (l === "o") {
      const b = useBotao(g, 20, 76, 22, furo);
      itens.push({ tipo: "b", el: b, g });
      x += (40 + esp) * esc;
      return;
    }
    const d = rabisco(GLIFOS[l].d, .9, 40 + i * 13, 3);
    const p = S("path", { d, fill: "none", stroke: cor, "stroke-width": 6.5, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
    const p2 = S("path", { d: rabisco(GLIFOS[l].d, 1.1, 90 + i * 7, 3), fill: "none", stroke: cor, "stroke-width": 2.6, opacity: .5, "stroke-linecap": "round", transform: "translate(1.4,1)" }, g);
    const L = p.getTotalLength();
    [p, p2].forEach((q) => { q.style.strokeDasharray = L + 2; q.style.strokeDashoffset = L + 2; });
    itens.push({ tipo: "p", els: [p, p2], L });
    x += (GLIFOS[l].w + esp) * esc;
  });
  return (prog) => {
    const n = itens.length;
    itens.forEach((it, i) => {
      const p = clamp(prog * n - i);
      if (it.tipo === "b") {
        it.g.style.opacity = p > 0 ? 1 : 0;
        it.el.setAttribute("transform", `translate(20 76) scale(${n1(eo(p) * 100) / 100}) rotate(${n1((1 - p) * -200)}) translate(-20 -76)`);
      } else {
        it.els.forEach((q) => (q.style.strokeDashoffset = (it.L + 2) * (1 - p)));
      }
    });
  };
}

// ── tile de ruído de papel e grão (gerados em canvas na hora; nenhum arquivo)
function gerarTexturas() {
  const tile = (tam, f) => {
    const c = document.createElement("canvas");
    c.width = c.height = tam;
    const g = c.getContext("2d");
    const im = g.createImageData(tam, tam);
    f(im.data, tam);
    g.putImageData(im, 0, 0);
    return c.toDataURL("image/png");
  };
  const r = rng(77);
  const papel = tile(256, (px, t) => {
    for (let i = 0; i < t * t; i++) {
      const x = i % t, y = (i / t) | 0;
      const fibra = Math.sin(x * .09 + Math.sin(y * .05) * 2) * 10 + Math.sin(y * .31 + x * .02) * 6;
      const v = 200 + fibra + (r() - .5) * 70;
      px[i * 4] = v; px[i * 4 + 1] = v * .97; px[i * 4 + 2] = v * .92; px[i * 4 + 3] = 255;
    }
  });
  const graos = [1, 2, 3].map((k) => tile(160, (px, t) => {
    const rr = rng(k * 991);
    for (let i = 0; i < t * t; i++) {
      const v = rr() > .5 ? 255 : 0;
      px[i * 4] = px[i * 4 + 1] = px[i * 4 + 2] = v;
      px[i * 4 + 3] = rr() * 255;
    }
  }));
  return { papel, graos };
}

    musBus = c.createGain(); musBus.gain.value = 0; musBus.connect(mestre); musBus.connect(revIn);
    fxBus = c.createGain(); fxBus.gain.value = .9; fxBus.connect(mestre); fxBus.connect(revIn);
    ecoDelay = c.createDelay(1); ecoDelay.delayTime.value = .38;
    const fb = c.createGain(); fb.gain.value = .38;
    ecoWet = c.createGain(); ecoWet.gain.value = 0;
    musBus.connect(ecoDelay); ecoDelay.connect(fb); fb.connect(ecoDelay); ecoDelay.connect(ecoWet); ecoWet.connect(mestre);
    ruido = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const rd = ruido.getChannelData(0);
    for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1;
    const sb = c.createBufferSource(); sb.buffer = c.createBuffer(1, 1, 22050); sb.connect(c.destination); sb.start(0);
    c.resume();
    aplicar({ reiniciar: true });
    setInterval(agendar, 80);
    document.addEventListener("visibilitychange", () => {
      if (!c) return;
      if (document.hidden) c.suspend(); else c.resume();
    });
  }

  function rampa(param, v, seg) {
    const t = c.currentTime;
    param.cancelScheduledValues(t);
    param.setValueAtTime(param.value, t);
    param.linearRampToValueAtTime(v, t + seg);
  }

  function aplicar(o = {}) {
    if (!c) return;
    const seg = o.rampa ?? 1.2;
    rampa(musBus.gain, est.vol * .9, seg);
    if (est.vol <= 0) zeroEm = c.currentTime + seg;
    rampa(ecoWet.gain, est.eco ? .55 : 0, 1);
    if (o.reiniciar) { idx = 0; batida = 0; prox = c.currentTime + .12; }
    if (est.drone && !droneNos) {
      const o1 = c.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = 55;
      const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.value = 82.4;
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 180;
      const g = c.createGain(); g.gain.value = 0;
      o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(mestre);
      o1.start(); o2.start();
      rampa(g.gain, .16, 2.5);
      droneNos = { o1, o2, g };
    } else if (!est.drone && droneNos) {
      const d = droneNos; droneNos = null;
      rampa(d.g.gain, 0, 1.2);
      d.o1.stop(c.currentTime + 1.3); d.o2.stop(c.currentTime + 1.3);
    }
  }

  function musica(o) {
    for (const k in o) if (k in est) est[k] = o[k];
    aplicar(o);
  }

  function env(g, t, pico, dec) {
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(pico, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dec);
  }

  function nota(f, t, dur, ganho = .2, bus = musBus) {
    const d = (Math.random() * 2 - 1) * est.desaf;
    const o1 = c.createOscillator(); o1.type = "triangle"; o1.frequency.value = f; o1.detune.value = d;
    const o2 = c.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2; o2.detune.value = d;
    const g = c.createGain(), g2 = c.createGain(); g2.gain.value = .35;
    const dec = .6 + Math.min(dur, 1.6) * .45;
    env(g, t, ganho, dec);
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus);
    o1.start(t); o2.start(t); o1.stop(t + dec + .05); o2.stop(t + dec + .05);
  }

  function glock(f, t, ganho = .07, bus = musBus) {
    [[1, 1], [2.76, .35], [5.4, .12]].forEach(([m, a]) => {
      const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f * m;
      const g = c.createGain(); env(g, t, ganho * a, .9 / m + .25);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.3);
    });
  }

  function baixo(f, t, dur) {
    const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f;
    const g = c.createGain(); env(g, t, .1, Math.min(2.2, dur + .6));
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + 2.4);
  }

  function pad(t, dur) {
    ["A3", "C#4", "E4"].forEach((n) => {
      const o = c.createOscillator(); o.type = "sine"; o.frequency.value = hz(n);
      const g = c.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(.028, t + 1);
      g.gain.setValueAtTime(.028, t + dur - 1);
      g.gain.linearRampToValueAtTime(.0001, t + dur + .6);
      o.connect(g); g.connect(musBus); o.start(t); o.stop(t + dur + .7);
    });
  }

  function agendar() {
    if (!c || c.state !== "running") return;
    if (est.vol <= 0 && c.currentTime > zeroEm) { prox = c.currentTime + .1; return; }
    const beat = 60 / 84 / est.tempo;
    const maior = est.tom === "maior";
    while (prox < c.currentTime + .3) {
      const [n, d] = MEL[idx];
      const f = hz(n, maior) * Math.pow(2, est.oit);
      nota(f, prox, d * beat);
      if (est.glock) glock(f * 2, prox);
      if (batida % 3 === 0) {
        const comp = Math.floor(batida / 3) % 8;
        baixo(hz(BAIXO[maior ? "maior" : "menor"][comp]) * Math.pow(2, est.oit), prox, beat * 3);
        if (comp === 0 && est.pad && maior) pad(prox, beat * 24);
      }
      prox += d * beat;
      batida += d;
      idx = (idx + 1) % MEL.length;
    }
  }

  // ── efeitos
  function ruidoFx(t, dur, filtro, f0, f1, ganho, q = 1) {
    const s = c.createBufferSource(); s.buffer = ruido; s.loop = true;
    const fl = c.createBiquadFilter(); fl.type = filtro; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); env(g, t, ganho, dur);
    s.connect(fl); fl.connect(g); g.connect(fxBus);
    s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  }
  const ok = () => c && c.state === "running";
  const T = () => c.currentTime + .01;

  const fx = {
    tick() { if (ok()) ruidoFx(T(), .03, "highpass", 3200, 3000, .3); },
    fio() { if (ok()) ruidoFx(T(), .42, "bandpass", 2000, 6000, .14, 4); },
    chave() {
      if (!ok()) return;
      const t = T();
      [1800, 2620, 4100].forEach((f, i) => {
        const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f * (1 + (Math.random() - .5) * .01);
        const g = c.createGain(); env(g, t, [.14, .1, .04][i], .18 + i * .05);
        o.connect(g); g.connect(fxBus); o.start(t); o.stop(t + .4);
      });
    },
    giro() { if (ok()) [0, .07, .15].forEach((d) => ruidoFx(T() + d, .03, "bandpass", 1400, 1300, .25, 6)); },
    porta() {
      if (!ok()) return;
      const t = T();
      const o = c.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(62, t); o.frequency.linearRampToValueAtTime(92, t + .8); o.frequency.linearRampToValueAtTime(70, t + 1.5);
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 300; lp.Q.value = 6;
      const trem = c.createOscillator(); trem.frequency.value = 7;
      const tg = c.createGain(); tg.gain.value = .1;
      const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.24, t + .15); g.gain.linearRampToValueAtTime(.0001, t + 1.55);
      trem.connect(tg); tg.connect(g.gain);
      o.connect(lp); lp.connect(g); g.connect(fxBus);
      o.start(t); trem.start(t); o.stop(t + 1.6); trem.stop(t + 1.6);
    },
    ding(i) {
      if (!ok()) return;
      const esc = ["A4", "C5", "D5", "E5", "G5", "A5", "C6", "D6", "E6", "G6", "A6", "C7"];
      const f = hz(esc[i % esc.length]);
      nota(f, T(), 1.4, .22, fxBus);
      glock(f, T(), .08, fxBus);
    },
    carimbo() {
      if (!ok()) return;
      const t = T();
      const o = c.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + .2);
      const g = c.createGain(); env(g, t, .55, .3);
      o.connect(g); g.connect(fxBus); o.start(t); o.stop(t + .35);
      ruidoFx(t, .03, "lowpass", 2500, 2000, .3);
    },
    miau() {
      if (!ok()) return;
      const t = T();
      const o = c.createOscillator(); o.type = "sawtooth";
      o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(820, t + .16); o.frequency.linearRampToValueAtTime(430, t + .5);
      const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 3;
      bp.frequency.setValueAtTime(900, t); bp.frequency.linearRampToValueAtTime(1600, t + .18); bp.frequency.linearRampToValueAtTime(800, t + .5);
      const g = c.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.12, t + .06); g.gain.linearRampToValueAtTime(.0001, t + .55);
      o.connect(bp); bp.connect(g); g.connect(fxBus); o.start(t); o.stop(t + .6);
    },
    ossos() { if (ok()) for (let i = 0; i < 6; i++) ruidoFx(T() + i * (.04 + Math.random() * .05), .025, "bandpass", 1500, 1200, .16, 5); },
    brilho() {
      if (!ok()) return;
      const t = T(), o = c.createOscillator(); o.type = "sine"; o.frequency.value = 2400 + Math.random() * 900;
      const g = c.createGain(); env(g, t, .06, .3); o.connect(g); g.connect(fxBus); o.start(t); o.stop(t + .35);
    },
    rasgo() { if (ok()) ruidoFx(T(), .75, "bandpass", 1800, 600, .22, 1.5); },
    queda() { if (ok()) ruidoFx(T(), 1.6, "lowpass", 1400, 200, .1); },
    sinos() {
      if (!ok()) return;
      ["A5", "E6", "C#6", "A6"].forEach((n, i) => glock(hz(n), T() + i * .18, .13, fxBus));
    },
    acorde() {
      if (!ok()) return;
      ["A4", "C5", "E5", "A5"].forEach((n, i) => nota(hz(n), T() + i * .06, 1.6, .16, fxBus));
    },
    costura() { if (ok()) for (let i = 0; i < 5; i++) ruidoFx(T() + i * .12, .03, "highpass", 3200, 3000, .25); },
  };

  return {
    iniciar, musica, ...fx,
    pronto: () => !!c,
    mudo: () => mudo,
    alternarMudo() {
      mudo = !mudo;
      if (c) rampa(mestre.gain, mudo ? 0 : .5, .3);
      return mudo;
    },
  };
})();

// ── motor.js
// ─────────────────────────────────────────────────────────────
// Motor de cenas: relógio, cartões, transições, controles, modos
// ─────────────────────────────────────────────────────────────
const Q = new URLSearchParams(location.search);
const MODO_GRAVAR = Q.get("gravar") === "1";
const REDUZIDO = matchMedia("(prefers-reduced-motion: reduce)").matches;

const E = {
  idx: -1, cena: null, inst: null, raiz: null,
  relogio: 0, tIni: 0, ult: 0, cue: 0, cartaoIdx: -1,
  trans: null, replay: false, cor: 0,
  gatos: new Set(), caixa: { x: 0, y: 0, w: 360, h: 640, k: 1 },
  fpsBaixo: false, dts: [], giro: { x: 0, y: 0 },
  reduzido: REDUZIDO, gravar: MODO_GRAVAR,
};

let palco, camada, grao, texturas;

function tCena() { return E.relogio - E.tIni; }

// ── caixa da arte (360x640, "meet") dentro do palco
function medir() {
  const W = palco.clientWidth, Hh = palco.clientHeight;
  const k = Math.min(W / 360, Hh / 640);
  E.caixa = { x: (W - 360 * k) / 2, y: (Hh - 640 * k) / 2, w: 360 * k, h: 640 * k, k, W, H: Hh };
  document.querySelectorAll(".sobre").forEach(posicionarSobre);
  if (E.inst && E.inst.redimensionar) E.inst.redimensionar();
}
function posicionarSobre(d) {
  const c = E.caixa;
  d.style.left = c.x + "px"; d.style.top = c.y + "px";
  d.style.width = c.w + "px"; d.style.height = c.h + "px";
  d.style.setProperty("--k", c.k);
}
function sobre(raiz) { const d = H("div", { class: "sobre" }, raiz); posicionarSobre(d); return d; }
// ponto da arte -> % do palco
function pctArte(x, y) {
  const c = E.caixa;
  return [((c.x + x * c.k) / c.W) * 100, ((c.y + y * c.k) / c.H) * 100];
}

// ── cor do mundo: 0 = cinza, 1 = cor (e o fio vira dourado)
function misturar(a, b, p) {
  const h = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
  const A = h(a), B = h(b);
  return "rgb(" + A.map((v, i) => Math.round(lerp(v, B[i], p))).join(",") + ")";
}
function setCor(v) {
  v = clamp(v);
  if (E.replay) v = 1;
  if (Math.abs(v - E.cor) < .001 && palco.style.getPropertyValue("--cor")) return;
  E.cor = v;
  palco.style.setProperty("--cor", v.toFixed(3));
  palco.style.setProperty("--fio", misturar(C.tinta, C.amarelo, v));
  palco.classList.toggle("colorido", v >= .999);
}

// ── cartão de mensagem (letra a letra, como tinta secando)
const Cartao = (() => {
  let el, letras = [], ini = 0, ativo = false, len = 0, vis = -1;
  const MS = 32;
  function criar(pai) { el = H("div", { id: "cartao", "aria-live": "polite" }, pai); }
  function mostrar(texto, inicio, bilhete) {
    el.innerHTML = "";
    el.classList.remove("on", "pronto");
    el.classList.toggle("bilhete", !!bilhete);
    el.style.setProperty("--rot", ((Math.random() - .5) * 2).toFixed(2) + "deg");
    const pal = texto.split(" ");
    letras = [];
    pal.forEach((p, i) => {
      const w = H("span", { class: i === pal.length - 1 ? "ult" : "" }, el);
      [...(p + (i < pal.length - 1 ? " " : ""))].forEach((ch) => letras.push(H("span", { class: "l", txt: ch }, w)));
    });
    el.setAttribute("aria-label", texto);
    len = letras.length; ini = inicio ?? E.relogio; vis = -1; ativo = true;
    void el.offsetWidth;
    el.classList.add("on");
  }
  function passo(agora) {
    if (!ativo) return;
    const n = clamp(Math.floor((agora - ini) / MS), 0, len);
    if (n === vis) return;
    for (let i = Math.max(0, vis); i < n; i++) letras[i].classList.add("v");
    vis = n;
    if (n >= len) el.classList.add("pronto");
  }
  return {
    criar, mostrar, passo,
    esconder() { ativo = false; el.classList.remove("on"); },
    digitando: () => ativo && vis < len,
    completar() { ini = E.relogio - len * MS; },
  };
})();

// escrita letra a letra em qualquer elemento (cena 14)
function escrita(el, texto) {
  el.innerHTML = "";
  const ls = [...texto].map((ch) => H("span", { class: "l", txt: ch }, el));
  const linha = H("span", { class: "linha-ouro" }, el);
  let vis = 0;
  return (tRel) => {
    const n = clamp(Math.floor(tRel / 45), 0, ls.length);
    for (let i = vis; i < n; i++) ls[i].classList.add("v");
    vis = Math.max(vis, n);
    linha.style.setProperty("--p", clamp(tRel / (ls.length * 45 + 300)).toFixed(3));
  };
}

// ── aviso curto no topo
let avisoEl, avisoAte = 0;
function aviso(texto, ms = 1800) {
  avisoEl.textContent = texto;
  avisoEl.classList.add("on");
  avisoAte = E.relogio + ms;
}

// ── easter egg: ache o gato (cenas 1, 3, 6, 9 e 10)
function marcarGato(id) {
  if (E.gatos.has(id)) return false;
  E.gatos.add(id);
  Som.miau();
  aviso(txt("aviso_gato", { G: E.gatos.size }));
  return true;
}
function gatoEspia(pai, x, y, rot, id, esc = 1, aoTocar) {
  const g = S("g", { class: "toque", transform: `translate(${x} ${y}) rotate(${rot}) scale(${esc})` }, pai);
  S("circle", { cx: 0, cy: 0, r: 34, fill: "transparent" }, g);
  const cab = S("g", {}, g);
  S("use", { href: "#gato", x: -30, y: -30, width: 60, height: 50 }, cab);
  g.addEventListener("pointerup", (ev) => {
    ev.stopPropagation();
    Som.iniciar();
    if (aoTocar) aoTocar();
    else marcarGato(id);
  });
  return {
    g,
    tocar(t) {
      const sai = 6 + 5 * (0.5 + 0.5 * Math.sin(t / 1300 + x));
      cab.setAttribute("transform", `translate(0 ${n1(sai)}) rotate(${n1(Math.sin(q12(t) / 900) * 4)})`);
    },
  };
}

// ── transições reutilizáveis (T1..T9)
const JAG = (() => { const r = rng(5); return Array.from({ length: 23 }, () => (r() - .5) * 7); })();

function passoTrans() {
  const tr = E.trans;
  const p = fase(E.relogio, tr.ini, tr.ini + tr.dur);
  const V = tr.velha.raiz.style, N = tr.nova.style;
  switch (tr.tipo) {
    case "furo": {
      const [x, y] = tr.pct;
      N.clipPath = N.webkitClipPath = `circle(${n1(ei(p) * 150)}% at ${n1(x)}% ${n1(y)}%)`;
      V.transformOrigin = `${x}% ${y}%`;
      V.transform = `scale(${1 + ei(p) * .6})`;
      break;
    }
    case "puxa": {
      const q = eio(p);
      V.transform = `translateX(${-q * 100}%)`;
      N.transform = `translateX(${(1 - q) * 100}%)`;
      tr.fio.style.opacity = Math.sin(p * Math.PI);
      tr.fio.style.transform = `translateX(${(1 - q) * 100 - 50}%)`;
      break;
    }
    case "sobe": {
      const q = eio(p);
      V.transform = `translateY(${-q * 100}%)`;
      N.transform = `translateY(${(1 - q) * 100}%)`;
      break;
    }
    case "queda": {
      const q = eio(p);
      V.transform = `translateY(${-q * 100}%)`;
      N.transform = `translateY(${(1 - q) * 100}%)`;
      tr.fio.style.opacity = Math.sin(p * Math.PI) * .8;
      break;
    }
    case "zoom":
      V.transform = `scale(${1 + ei(p) * 7})`;
      V.opacity = 1 - p;
      N.opacity = p;
      break;
    case "preto":
      V.opacity = clamp(1 - p * 2);
      N.opacity = clamp(p * 2 - 1);
      break;
    case "rasgo": {
      const X = (1 - eio(p)) * 112 - 6;
      const pts = ["0% 0%"];
      JAG.forEach((j, i) => pts.push(`${n1(X + j)}% ${n1((i / (JAG.length - 1)) * 100)}%`));
      pts.push("0% 100%");
      V.zIndex = 3;
      V.clipPath = V.webkitClipPath = `polygon(${pts.join(",")})`;
      V.transform = `translateX(${-p * 12}%) rotate(${-p * 2}deg)`;
      break;
    }
    default:
      N.opacity = p;
  }
  if (p >= 1) terminarTrans();
}

function terminarTrans() {
  const tr = E.trans;
  if (!tr) return;
  E.trans = null;
  ["clipPath", "webkitClipPath", "transform", "opacity", "transformOrigin", "zIndex"].forEach((k) => (tr.nova.style[k] = ""));
  if (tr.fio) tr.fio.remove();
  try { tr.velha.inst && tr.velha.inst.sair && tr.velha.inst.sair(); } catch (e) { console.error(e); }
  tr.velha.raiz.remove();
}

function normalizarTrans(t) {
  if (!t) return { tipo: "fade" };
  if (typeof t === "string") return { tipo: t };
  return t;
}

// ── navegação
function irPara(idx, trans) {
  if (idx < 0 || idx >= CENAS.length) return;
  if (E.trans) terminarTrans();
  const velha = { raiz: E.raiz, inst: E.inst, cena: E.cena };
  const cena = CENAS[idx];
  trans = normalizarTrans(trans);
  if (E.reduzido && !["corte", "continua"].includes(trans.tipo)) trans = { tipo: "fade", dur: 300 };

  const continua = trans.tipo === "continua" && velha.inst && velha.inst.mundo;
  let raiz;
  if (continua) raiz = velha.raiz;
  else {
    raiz = H("div", { class: "cena" + (cena.cinza ? " cinza" : "") }, camada);
    raiz.style.background = cena.fundo || "#000";
  }

  E.idx = idx; E.cena = cena; E.raiz = raiz;
  E.tIni = E.relogio; E.cue = 0; E.cartaoIdx = -1;
  Cartao.esconder();
  try {
    E.inst = cena.montar(raiz, continua ? velha.inst : null) || {};
  } catch (e) {
    console.error(e);
    E.inst = {};
  }
  if (!continua && !cena.semRuido) H("div", { class: "ruido" }, raiz);
  if (cena.musica) Som.musica(cena.musica);
  atualizarUI();

  if (velha.raiz && !continua) {
    if (trans.tipo === "corte") {
      try { velha.inst && velha.inst.sair && velha.inst.sair(); } catch (e) { console.error(e); }
      velha.raiz.remove();
    } else {
      const tr = { ...trans, ini: E.relogio, dur: trans.dur || 1100, velha, nova: raiz };
      if (trans.tipo === "furo") tr.pct = pctArte(trans.x ?? 180, trans.y ?? 320);
      if (trans.tipo === "puxa" || trans.tipo === "queda") {
        tr.fio = H("div", {}, camada);
        Object.assign(tr.fio.style, trans.tipo === "puxa"

      }

      passoTrans();
    }

function proxima(trans) {
  if (E.idx + 1 >= CENAS.length) return;

}

// ── toque
function aoTocar(ev) {
  if (ev.target.closest && ev.target.closest(".ui, button, .carta")) return;
  Som.iniciar();
  if (E.trans) return;
  const inst = E.inst;
  if (inst.tap && inst.tap(ev)) return;
  if (E.cena.interativa) return;
  if (Cartao.digitando()) { Cartao.completar(); return; }
  const t = tCena();
  const prox = (E.cena.textos || []).map((x) => x[0]).filter((b) => b > t + 250);
  if (prox.length) E.tIni -= prox[0] - t;

const DUR_INTERATIVA = 30000;
function passoProgresso(t) {
  let tot = 0, feito = 0;
  CENAS.forEach((c, i) => {
    if (c.semProgresso) return;
    const d = c.dur || DUR_INTERATIVA;
    tot += d;
    if (i < E.idx) feito += d;
    else if (i === E.idx) feito += Math.min(t, d);
  });
  const x = 4 + 292 * (tot ? feito / tot : 0);
  progFeito.setAttribute("x2", n1(x));
  progAgulha.setAttribute("transform", `translate(${n1(x)} 0)`);
}

// ── laço principal
let ultGrao = 0, gIdx = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, ts - (E.ult || ts));
  E.ult = ts;
  passo(dt, ts);
}

function passo(dt, ts) {
  E.relogio += dt;

  // monitor de FPS (cai para versão leve abaixo de ~40 fps)
  if (dt > 0) {
    E.dts.push(dt);
    if (E.dts.length > 90) E.dts.shift();
    if (E.dts.length === 90 && !E.fpsBaixo) {
      const m = E.dts.reduce((a, b) => a + b) / 90;
      if (m > 25) E.fpsBaixo = true;
    }
  }

  const cena = E.cena;
  const t = tCena();

  if (cena.sons) {
    while (E.cue < cena.sons.length && cena.sons[E.cue][0] <= t) {
      const [ct, f, sfx] = cena.sons[E.cue];
      if (!sfx || t - ct < 450) try { f(); } catch (e) { console.error(e); }
      E.cue++;
    }
  }

  try { E.inst.tocar && E.inst.tocar(t, dt); } catch (e) { console.error(e); }
  if (E.trans) passoTrans();

  if (cena.textos) {
    let k = -1;
    cena.textos.forEach((x, i) => { if (t >= x[0]) k = i; });
    if (k !== E.cartaoIdx) {
      E.cartaoIdx = k;
      if (k >= 0) Cartao.mostrar(txt(cena.textos[k][1]), E.tIni + cena.textos[k][0]);
    }
    if (cena.esconderCartao && t > cena.esconderCartao) Cartao.esconder();
  }
  Cartao.passo(E.relogio);
  passoProgresso(t);

  if (avisoAte && E.relogio > avisoAte) { avisoEl.classList.remove("on"); avisoAte = 0; }

  if (ts - ultGrao > 125 && !E.reduzido) {
    ultGrao = ts;
    gIdx = (gIdx + 1) % 3;
    grao.style.backgroundImage = `url(${texturas.graos[gIdx]})`;
    grao.style.backgroundPosition = `${(gIdx * 53) % 160}px ${(gIdx * 97) % 160}px`;
  }

  if (!E.trans) {
    if (cena.dur && t >= cena.dur) proxima();
    else if (E.inst.terminou) { const tr = E.inst.terminou; E.inst.terminou = null; proxima(tr === true ? null : tr); }
  }
}

function boot() {
  palco = document.getElementById("palco");
  if (E.gravar) palco.classList.add("gravando");
  montarDefs();
  texturas = gerarTexturas();
  palco.style.setProperty("--ruido-papel", `url(${texturas.papel})`);
  document.documentElement.style.setProperty("--ruido-papel", `url(${texturas.papel})`);
  camada = H("div", { id: "cenas" }, palco);
  Cartao.criar(palco);
  grao = H("div", { id: "grao", "aria-hidden": "true" }, palco);
  H("div", { id: "vinheta", "aria-hidden": "true" }, palco);
  montarUI();
  setCor(0);
  medir();
  addEventListener("resize", medir);
  palco.addEventListener("pointerup", aoTocar);

  // giroscópio: só onde não precisa pedir permissão (Android); no iPhone não incomoda
  addEventListener("deviceorientation", (e) => {
    if (e.gamma == null) return;
    E.giro.x = clamp(e.gamma / 30, -1, 1);
    E.giro.y = clamp((e.beta - 45) / 30, -1, 1);
  });

  const n = parseInt(Q.get("cena"), 10);
  if (!isNaN(n) && n > 0 && n < CENAS.length) {
    if (n >= 13 || Q.get("cor") === "1") setCor(1);
    irPara(n, "corte");
    const t0 = parseInt(Q.get("t"), 10);
    if (t0) E.tIni -= t0;
  } else irPara(0, "corte");

  if (Q.get("quadro") === "1") {
    // modo quadro a quadro: usado só para gerar o MP4 de backup
    let ts = 0;
    window.__quadro = (ms) => { ts += ms; passo(ms, ts); };
    window.__estado = () => ({ idx: E.idx, t: tCena() });
  } else requestAnimationFrame(loop);
}

document.addEventListener("DOMContentLoaded", boot);

// ── mão esquelética com hachura (cenas 5 e 15)
function maoEsqueleto(pai, seed = 1) {
  const g = S("g", {}, pai);
  const BRACO = "M392,250 C360,262 330,280 290,300";
  S("path", { d: tuboD(BRACO, 48, 34, seed, 1, 1), fill: "#ECE8E0", stroke: C.tinta, "stroke-width": 1.6 }, g);
  S("path", { d: tuboD(BRACO, 48, 34, seed, 1, 1), fill: "url(#hA)", opacity: .75 }, g);
  S("path", { d: tuboD("M392,262 C360,274 330,290 292,306", 22, 14, seed + 1, .6, 1), fill: "url(#hB)", opacity: .7 }, g);
  const palma = "M304,276 C282,258 250,260 238,280 C228,300 232,332 248,350 C266,362 294,352 306,330 Z";
  forma(g, palma, "#ECE8E0", { w: 1.8, seed: seed + 2, hachura: "hA", hop: .65 });
  S("path", { d: rabisco("M300,300 C282,312 262,320 246,330", .6, seed + 3), fill: "url(#hB)", stroke: "none" }, g);

  const DEDOS = [
    { b: [262, 270], L: [60, 58, 44], fechado: [-165, -180, 150], abre: [28, 40, 52], cima: 1, unha: 40 },
    { b: [268, 286], L: [56, 52, 40], fechado: [-172, 172, 140], abre: [30, 44, 56], cima: 1, unha: 34 },
    { b: [264, 330], L: [56, 52, 40], fechado: [176, 150, 118], abre: [-24, -36, -46], cima: 0, unha: 36 },
    { b: [252, 348], L: [58, 54, 40], fechado: [122, 165, -168], abre: [-20, -38, -48], cima: 0, unha: 44 },
  ];
  const els = DEDOS.map(() => {
    const d = S("g", {}, g);
    return {
      base: S("path", { fill: "#ECE8E0", stroke: C.tinta, "stroke-width": 1.5 }, d),
      hach: S("path", { fill: "url(#hA)", opacity: .7 }, d),
      js: [0, 1, 2].map((i) => S("circle", { r: [6.6, 5.6, 4.4][i], fill: "#E2DDD3", stroke: C.tinta, "stroke-width": 1.3 }, d)),
      unha: S("path", { fill: C.tinta }, d),
    };
  });
  let ult = -1;
  function atualizar(abertura) {
    const k = Math.round(abertura * 40);
    if (k === ult) return;
    ult = k;
    const a = k / 40;
    DEDOS.forEach((D, i) => {
      let [x, y] = D.b, ang = 0;
      const pts = [[x, y]], juntas = [];
      D.L.forEach((len, j) => {
        ang = D.fechado[j] + D.abre[j] * a;
        const nx = x + Math.cos(rad(ang)) * len, ny = y + Math.sin(rad(ang)) * len;
        for (let s = 1; s <= 6; s++) pts.push([lerp(x, nx, s / 6), lerp(y, ny, s / 6)]);
        x = nx; y = ny;
        juntas.push([x, y]);
      });
      const e = els[i];
      const d = tubo(pts, 13, 4.6, seed * 10 + i, .7, .9);
      e.base.setAttribute("d", d);
      e.hach.setAttribute("d", d);
      [[D.b[0], D.b[1]], juntas[0], juntas[1]].forEach((p, j) => { e.js[j].setAttribute("cx", n1(p[0])); e.js[j].setAttribute("cy", n1(p[1])); });
      const dx = Math.cos(rad(ang)), dy = Math.sin(rad(ang));
      const ponta = [x + dx * D.unha, y + dy * D.unha];
      e.unha.setAttribute("d", `M${n1(x - dy * 2.6)},${n1(y + dx * 2.6)} L${fp(ponta)} L${n1(x + dy * 2.6)},${n1(y - dx * 2.6)} Z`);
    });
  }
  return { g, atualizar };
}

        fio.setAttribute("d", `M${A[0]},${A[1]} L${K[0]},${n1(K[1] - 24 + dy)}`);
        nó.setAttribute("transform", `translate(0 ${n1(dy)})`);
        giroY.setAttribute("transform", `translate(${K[0]} ${n1(K[1] + dy)}) rotate(${n1(giro90)}) scale(${sx.toFixed(3)} 1) translate(${-K[0]} ${-K[1]})`);
        const a = rad(ang);
        const cx = A[0] - Math.sin(a) * (K[1] + dy - A[1]), cy = A[1] + Math.cos(a) * (K[1] + dy - A[1]) + y0;
        inst.cabeca = [cx, cy];
        gato.tocar(t);
      },
    };
    return inst;
  },
});

// A PORTA E O TÚNEL (cenas 7 e 8) — mesmo mundo, plano-sequência
// Folha da porta em CSS 3D (rotateY na dobradiça). Túnel projetado em
// perspectiva num canvas: nítido em qualquer escala e leve no celular.
// ═════════════════════════════════════════════════════════════
function criarMundoPorta(raiz) {
  const P = 600, VC = [180, 331];
  const cv = H("canvas", { class: "tela", "aria-hidden": "true" }, raiz);
  const g = cv.getContext("2d");
  const vista = sobre(raiz);
  vista.style.pointerEvents = "none";
  const plano = H("div", {}, vista);
  Object.assign(plano.style, {
    position: "absolute", left: 0, top: 0, width: "360px", height: "640px",
    transformOrigin: "0 0", perspective: P + "px", perspectiveOrigin: `${VC[0]}px ${VC[1]}px`,
  });
  const folha = H("div", {}, plano);
  Object.assign(folha.style, {
    position: "absolute", left: "120px", top: "210px", width: "120px", height: "242px",
    transformOrigin: "100% 50%", transformStyle: "preserve-3d", webkitTransformStyle: "preserve-3d",
  });
  const face = (espelho) => {
    const f = H("div", {}, folha);
    Object.assign(f.style, { position: "absolute", inset: 0, backfaceVisibility: "hidden", webkitBackfaceVisibility: "hidden", transform: espelho ? "rotateY(180deg)" : "" });
    const s = S("svg", { viewBox: "0 0 120 242", width: 120, height: 242, style: "display:block" }, f);
    const gg = S("g", { transform: espelho ? "translate(120 0) scale(-1 1)" : "" }, s);
    S("rect", { x: 0, y: 0, width: 120, height: 242, fill: "#F4F2EE" }, gg);
    traco(gg, "M1.5,1.5 L118.5,1.5 L118.5,240.5 L1.5,240.5 Z", { w: 3, seed: espelho ? 11 : 12, amp: .7 });
    traco(gg, "M32,214 L32,74 C32,38 90,38 90,74 L90,214 Z", { w: 2.3, seed: espelho ? 13 : 14, amp: .7 });
    for (let x = 108; x < 118; x += 2.2) S("path", { d: `M${x},6 L${x + .3},236`, stroke: C.tinta, "stroke-width": .7, opacity: .7 }, gg);
    S("rect", { x: 8, y: 140, width: 15, height: 24, rx: 5, fill: "#e6e3dc", stroke: C.tinta, "stroke-width": 1.5 }, gg);
    S("circle", { cx: 15.5, cy: 132, r: 7.5, fill: "#d6d3cc", stroke: C.tinta, "stroke-width": 2 }, gg);
    S("circle", { cx: 15.5, cy: 152, r: 1.6, fill: C.tinta }, gg);
  };
  face(false); face(true);
  const borda = H("div", {}, folha);
  Object.assign(borda.style, {
    position: "absolute", left: 0, top: 0, width: "9px", height: "242px", transformOrigin: "0 50%", transform: "rotateY(90deg)",
    background: "repeating-linear-gradient(90deg, #14110F 0 1px, #E8E5DE 1px 2.5px)", border: "1.5px solid #14110F",
  });

  let dpr = 1;
  function tamanho() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(raiz.clientWidth * dpr);
    cv.height = Math.round(raiz.clientHeight * dpr);
    posicionarSobre(vista);
  }
  tamanho();

  const N = E.fpsBaixo ? 30 : 44, DELTA = 55;
  const r = rng(505);
  const aneis = [];
  for (let i = 0; i < N; i++) {
    const pts = anelIrregular(54 + r() * 5, 112 + r() * 6, 500 + i, { amp: .065, quad: .3, voltas: 1.08, n: 90, cresce: .05 });
    aneis.push({
      p: new Path2D(suave(pts)),
      p2: new Path2D(suave(tremer(pts, 1.2, 900 + i))),
      d: 24 + i * DELTA, dir: i % 2 ? 1 : -1,
    });
  }
  const PR = 24 + N * DELTA + 20;
  const moldura = [
    new Path2D(rabisco("M112,202 L248,202 L248,453 L112,453 Z", 1, 3, 6)),
    new Path2D(rabisco("M120,210 L240,210 L240,453 L120,453 Z", .8, 5, 6)),
  ];
  const moldura2 = new Path2D(rabisco("M112,202 L248,202 L248,453 L112,453 Z", 1.3, 33, 6));
  let tk = "";
  for (let y = 214; y < 450; y += 4.5) tk += `M232,${y} L240,${y + .4}`;
  const marcas = new Path2D(tk);
  const chao = new Path2D(rabisco("M-260,453 L620,453", 1.2, 7, 12));

  function base(s, camX, camY) {
    const c = E.caixa, k = c.k;
    g.setTransform(dpr * k * s, 0, 0, dpr * k * s,
      dpr * (c.x + k * (VC[0] - s * (VC[0] + camX))),
      dpr * (c.y + k * (VC[1] - s * (VC[1] + camY))));
  }
  function proj(d, X, Y, travel, camX, camY) {
    const s = P / (P + d - travel), c = E.caixa;
    return [c.x + c.k * (VC[0] + (X - VC[0] - camX) * s), c.y + c.k * (VC[1] + (Y - VC[1] - camY) * s)];
  }

  function desenhar(o) {
    const { travel, camX = 0, camY = 0, rot = 0, porta = 0, fio = 0, preto = 0 } = o;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.fillStyle = "#EEEBE4";
    g.fillRect(0, 0, cv.width, cv.height);
    const s0 = P / (P - travel);
    const dentro = travel > P - 20;
    g.lineCap = "round"; g.lineJoin = "round";

    if (!dentro) {
      g.save();
      base(s0, camX, camY);
      g.beginPath(); g.rect(120, 210, 120, 243); g.clip();
      g.fillStyle = "#F5F3EE"; g.fillRect(120, 210, 120, 243);
    }
    // ponto de fuga: retângulo preto
    const dr = P + PR - travel;
    if (dr > 4) {
      base(P / dr, camX, camY);
      g.globalAlpha = 1; g.fillStyle = C.tinta;
      g.fillRect(VC[0] - 13, VC[1] - 21, 26, 42);
    } else {
      g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = C.tinta; g.fillRect(0, 0, cv.width, cv.height);
    }
    for (let i = aneis.length - 1; i >= 0; i--) {
      const a = aneis[i];
      const dist = P + a.d - travel;
      if (dist < 6) continue;
      const alpha = clamp(1.3 - a.d / 2700) * clamp((dist - 6) / 90);
      if (alpha < .01) continue;
      base(P / dist, camX, camY);
      g.translate(VC[0], VC[1]);
      // espiral: cada anel um pouco mais girado; vizinhos alternam um leve contra-giro
      g.rotate(rad(i * .9 + rot * .35 + a.dir * 1.6));
      g.strokeStyle = C.tinta;
      g.globalAlpha = alpha; g.lineWidth = 2.3; g.stroke(a.p);
      if (!E.fpsBaixo) { g.globalAlpha = alpha * .45; g.lineWidth = 1; g.stroke(a.p2); }
    }
    // o fio atravessa o centro
    if (fio > 0) {
      const d0 = dentro ? Math.max(0, travel - P + 30) : 0;
      const a = proj(d0, VC[0] + 6, VC[1] + 70, travel, camX, camY);
      const b = proj(PR - 10, VC[0] + 6, VC[1] + 70, travel, camX, camY);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = fio;
      g.strokeStyle = getComputedStyle(palco).getPropertyValue("--fio") || C.tinta;
      g.lineWidth = 1.8;
      g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
    }
    if (!dentro) {
      g.restore();
      base(s0, camX, camY);
      g.globalAlpha = 1; g.strokeStyle = C.tinta;
      g.lineWidth = 1.2; g.globalAlpha = .45; g.stroke(chao);
      g.globalAlpha = 1;
      g.lineWidth = 4.2; g.stroke(moldura[0]);
      g.lineWidth = 1.6; g.stroke(moldura[1]);
      g.globalAlpha = .5; g.lineWidth = 1.4; g.stroke(moldura2);
      g.globalAlpha = .9; g.lineWidth = .8; g.stroke(marcas);
    }
    if (preto > 0) {
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.globalAlpha = preto; g.fillStyle = "#0E0E10";
      g.fillRect(0, 0, cv.width, cv.height);
    }
    g.globalAlpha = 1;
    // folha da porta (CSS 3D)
    if (dentro || s0 > 7) plano.style.display = "none";
    else {
      plano.style.display = "";
      plano.style.transform = `scale(${E.caixa.k}) translate(${VC[0]}px,${VC[1]}px) scale(${s0}) translate(${-VC[0] - camX}px,${-VC[1] - camY}px)`;
      folha.style.transform = `rotateY(${porta.toFixed(2)}deg)`;
      plano.style.opacity = clamp(1 - (s0 - 3) / 4);
    }
  }
  return { desenhar, redimensionar: tamanho };
}

    for (let i = 0; i < 14; i++) {
      const d = doce(cont, i % 2);
      doces.push({ d, x: r() * 360, y: r() * 640, v: .006 + r() * .01, rv: (r() - .5) * .08, s: .8 + r() * .5 });
    }
    const corpo = corpoAdesivo(cont);
    corpo.g.setAttribute("transform", "translate(128 412) scale(1.02)");
    const rosto = rostoAdesivo(cont);
    rosto.g.setAttribute("transform", "translate(242 228) scale(.98)");
    // carimbo de correio
    const car = S("g", { opacity: 0 }, cont);
    const carIn = S("g", {}, car);
    S("circle", { r: 44, fill: "none", stroke: C.vinho, "stroke-width": 3 }, carIn);
    S("circle", { r: 37, fill: "none", stroke: C.vinho, "stroke-width": 1.4 }, carIn);
    for (let i = 0; i < 4; i++) S("path", { d: `M48,${-18 + i * 12} q12,-6 24,0 q12,6 24,0 q12,-6 24,0`, fill: "none", stroke: C.vinho, "stroke-width": 2.4 }, carIn);
    S("text", { y: -8, "text-anchor": "middle", fill: C.vinho, style: "font:bold 13px 'Courier New',monospace;letter-spacing:3px", txt: txt("c12_carimbo_a") }, carIn);
    S("text", { y: 14, "text-anchor": "middle", fill: C.vinho, style: "font:bold 17px 'Courier New',monospace;letter-spacing:2px", txt: txt("c12_carimbo_b") }, carIn);
    const costura = S("circle", { r: 52, fill: "none", stroke: C.amarelo, "stroke-width": 3, "stroke-dasharray": "6 5", "stroke-linecap": "round" }, car);
    const Lc = 2 * Math.PI * 52;

    // escuro + ponto amarelo (pausa dramática)
    const ponto = S("circle", { cx: 180, cy: 320, r: 9, fill: C.amarelo }, svg);
    const pontoG = S("circle", { cx: 180, cy: 320, r: 36, fill: "url(#brilhoOuro)" }, svg);

    return {
      tocar(t) {
        const pb = fase(t, 2000, 3800);
        circ.setAttribute("r", n1(eo(pb) * 760));
        setCor(fase(t, 2000, 4200));
        const pul = 1 + Math.sin(t / 260) * .12;
        ponto.setAttribute("r", n1(9 * pul * (1 - pb)));
        pontoG.setAttribute("r", n1(36 * pul * (1 - pb * .5)));
        pontoG.setAttribute("opacity", 1 - pb);
        const tq = q12(t);
        doces.forEach((d) => {
          const y = ((d.y + t * d.v) % 700) - 30;
          d.d.setAttribute("transform", `translate(${n1(d.x)} ${n1(y)}) rotate(${n1(tq * d.rv)}) scale(${d.s.toFixed(2)})`);
        });
        const pisca = [6400, 11000].some((b) => tq >= b && tq < b + 170);
        [rosto, corpo].forEach((o) => o.olhos.setAttribute("transform", pisca ? "translate(0 14) scale(1 .12) translate(0 -14)" : ""));
        if (!pisca) corpo.olhos.setAttribute("transform", "");
        const pc = fase(t, 8400, 8680);
        car.setAttribute("opacity", pc > 0 ? 1 : 0);
        car.setAttribute("transform", `translate(92 104) rotate(${n1(-14 + pc * 4)}) scale(${n1(lerp(1.5, 1, eo(pc)) * 100) / 100})`);
        const ps = fase(t, 13000, 14400);
        const np = Math.floor((Lc * ps) / 11);
        costura.setAttribute("opacity", ps > 0 ? 1 : 0);
        costura.style.strokeDasharray = np > 0 ? "6 5 ".repeat(np) + `0 ${n1(Lc + 10)}` : `0 ${n1(Lc + 10)}`;
        const bob = Math.sin(t / 900) * 3;
        corpo.g.setAttribute("transform", `translate(128 ${n1(412 + bob)}) rotate(${n1(Math.sin(tq / 1200) * 2)}) scale(1.02)`);
        rosto.g.setAttribute("transform", `translate(242 ${n1(228 - bob)}) rotate(${n1(Math.sin(tq / 1500 + 1) * 3)}) scale(.98)`);
      },
    };
  },
});

// CENA 13 — O nome (S, A, R, A, H — o H por último, em destaque)
CENAS.push({
  nome: "nome", dur: 13200, fundo: "linear-gradient(170deg, #F8DC7A 0%, #F6C9A0 55%, #F2A6B8 100%)",
  textos: [[8300, "c13"]],
  sons: [[7700, () => Som.sinos(), true]],
  saida: { tipo: "sobe", dur: 1300 },
  montar(raiz) {
    const svg = arte(raiz, false);
    const ouro = C.amareloEsc;
    // botão-lua que se desfaz em fio
    const lua = S("g", {}, svg);
    S("circle", { cx: 180, cy: 175, r: 120, fill: "url(#brilhoOuro)", opacity: .5 }, lua);
    useBotao(lua, 180, 175, 70, "#F8DC7A");
    const esp = [];
    for (let i = 0; i <= 120; i++) { const a = i * .24, rr = 6 + i * .62; esp.push([180 + Math.cos(a) * rr, 175 + Math.sin(a) * rr]); }
    esp.push([140, 280], [60, 300]);
    const espiral = S("path", { d: suave(esp), fill: "none", stroke: ouro, "stroke-width": 2.2, "stroke-linecap": "butt" }, svg);
    const Le = espiral.getTotalLength();
    espiral.style.strokeDasharray = Le; espiral.style.strokeDashoffset = Le;

    // as letras
    const nome = NOME.toUpperCase();
    const esc = .9, gap = 10;
    const larg = [...nome].reduce((s, ch) => s + GLIFOS[ch].w + gap, -gap) * esc;
    let x = 180 - larg / 2;
    const letras = [...nome].map((ch, i) => {
      const g = S("g", { transform: `translate(${n1(x)} 300) scale(${esc})` }, svg);
      const d = rabisco(GLIFOS[ch].d, .7, 500 + i * 9, 3);
      const sombra = S("path", { d, fill: "none", stroke: "rgba(122,46,62,.18)", "stroke-width": 9, "stroke-linecap": "round", transform: "translate(2 3)" }, g);
      const base = S("path", { d, fill: "none", stroke: ouro, "stroke-width": 2.2, opacity: .55, "stroke-linecap": "round" }, g);
      const ponto = S("path", { d, fill: "none", stroke: "#B5770A", "stroke-width": 7.5, "stroke-linecap": "round" }, g);
      const brilho = S("path", { d, fill: "none", stroke: "#FFE58A", "stroke-width": 2.4, "stroke-linecap": "round" }, g);
      const L = ponto.getTotalLength();
      const cx = x + (GLIFOS[ch].w * esc) / 2;
      x += (GLIFOS[ch].w + gap) * esc;
      return { g, sombra, base, ponto, brilho, L, cx, ini: 2600 + i * 1000 };
    });
    const ultima = letras[letras.length - 1];
    const halo = S("circle", { cx: ultima.cx, cy: 345, r: 0, fill: "url(#brilhoOuro)" }, svg);
    svg.insertBefore(halo, ultima.g);
    const r = rng(1313);
    const parts = E.reduzido ? [] : Array.from({ length: 30 }, () => ({
      a: r() * Math.PI * 2, v: .04 + r() * .09, rr: 1.5 + r() * 2.5,
      el: S("circle", { r: 0, fill: r() > .5 ? C.amarelo : "#FFF3B8" }, svg),
    }));
    const pontos = (L, p) => {
      const n = Math.floor((L * p) / 14);
      return n > 0 ? "9 5 ".repeat(n) + `0 ${n1(L + 20)}` : `0 ${n1(L + 20)}`;
    };
    let ticks = 0;
    return {
      tocar(t) {
        const pd = fase(t, 300, 2600);
        lua.setAttribute("opacity", 1 - eio(fase(t, 900, 2500)));
        lua.setAttribute("transform", `rotate(${n1(pd * 200)} 180 175)`);
        espiral.style.strokeDashoffset = Le * (1 - eio(pd));
        espiral.setAttribute("opacity", 1 - fase(t, 2600, 3600));
        letras.forEach((l, i) => {
          const p = fase(t, l.ini, l.ini + 900);
          l.g.style.visibility = p > 0 ? "visible" : "hidden";
          l.base.style.strokeDasharray = `${n1(l.L * p)} ${n1(l.L + 20)}`;
          l.sombra.style.strokeDasharray = `${n1(l.L * p)} ${n1(l.L + 20)}`;
          const dash = pontos(l.L, p);
          l.ponto.style.strokeDasharray = dash;
          l.brilho.style.strokeDasharray = dash;
          l.brilho.style.strokeDashoffset = 1.5;
          const nt = Math.floor(p * 6);
          if (p > 0 && p < 1 && i * 6 + nt > ticks) { ticks = i * 6 + nt; Som.tick(); }
        });
        // o H: brilha e pulsa duas vezes
        const ph = fase(t, ultima.ini + 900, ultima.ini + 2500);
        const pulso = Math.sin(ph * Math.PI * 2) ** 2;
        ultima.g.setAttribute("transform", `translate(${n1(ultima.cx)} 345) scale(${(1 + pulso * .16).toFixed(3)}) translate(${n1(-ultima.cx)} -345) ` + `translate(${n1(ultima.cx - (GLIFOS[nome[nome.length - 1]].w * esc) / 2)} 300) scale(${esc})`);
        halo.setAttribute("r", n1(ph > 0 ? 40 + pulso * 50 : 0));
        halo.setAttribute("opacity", (ph > 0 ? .5 + pulso * .5 : 0) * (1 - fase(t, 11500, 12500) * .6));
        parts.forEach((q) => {
          const u = Math.max(0, t - ultima.ini - 900);
          const pp = clamp(u / 2200);
          if (pp <= 0 || pp >= 1) { q.el.setAttribute("r", 0); return; }
          q.el.setAttribute("cx", n1(ultima.cx + Math.cos(q.a) * q.v * u));
          q.el.setAttribute("cy", n1(345 + Math.sin(q.a) * q.v * u + u * u * .00002));
          q.el.setAttribute("r", n1(q.rr * (1 - pp)));
        });
      },
    };
  },
});

// CENA 14 — Final
CENAS.push({
  nome: "final", dur: 21000, fundo: "radial-gradient(circle at 50% 38%, #FBE38E 0%, #F2C230 70%, #E3A91C 100%)",
  sons: [[3800, () => Som.fio(), true], [8400, () => Som.fio(), true], [12400, () => Som.sinos(), true], [17600, () => Som.musica({ vol: 0, rampa: 3.2 })]],
  saida: { tipo: "rasgo", dur: 1500 },
  montar(raiz) {
    const svg = arte(raiz, false);
    const poster = S("g", {}, svg);
    // fios dourados em S
    const fios = [
      "M172,196 C130,250 116,300 146,346 C170,384 120,420 92,470 C70,512 84,566 126,606",
      "M190,196 C232,252 246,300 214,346 C188,384 242,426 270,470 C292,508 280,562 246,612",
    ].map((d) => {
      const p = S("path", { d: rabisco(d, .5, 19, 6), fill: "none", stroke: C.amareloEsc, "stroke-width": 1.7, opacity: .9 }, poster);
      const L = p.getTotalLength();
      p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
      return { p, L };
    });
    // a mesma mão do pôster, agora aberta e suave (pontas arredondadas, sem garras)
    const mao = S("g", {}, poster);
    [
      ["M372,22 C262,0 120,14 76,82 C58,112 62,150 76,180", 22, 9],
      ["M372,56 C280,40 170,58 136,104 C118,130 122,160 134,184", 17, 8],
      ["M372,88 C330,84 296,100 286,136 C280,160 286,180 298,196", 16, 8],
      ["M372,108 C384,140 372,176 350,206", 18, 8],
    ].forEach(([d, w0, w1], i) => {
      S("path", { d: tuboD(d, w0, w1, 140 + i, .7, .8), fill: "#2A1D17" }, mao);
      S("path", { d: rabisco(d, .9, 150 + i, 6), fill: "none", stroke: "#C98F12", "stroke-width": 1, opacity: .55, transform: "translate(-2 2)" }, mao);
      const fim = amostrar(d, 8)[0].slice(-1)[0];
      S("circle", { cx: n1(fim[0]), cy: n1(fim[1]), r: w1 / 2, fill: "#2A1D17" }, mao);
    });
    const chave = S("g", {}, poster);
    useChave(chave, 181, 172, .95, "#F7D36A");
    const escrever = tituloCoraline(poster, 180, 372, .78, C.tinta, "#F7D36A");

    const sob = sobre(raiz);
    const a = H("div", { class: "t14 t14-a" }, sob);
    const b = H("div", { class: "t14 t14-b" }, sob);
    const c = H("div", { class: "t14 t14-c" }, sob);
    const ea = escrita(a, txt("c14a")), eb = escrita(b, txt("c14b")), ec = escrita(c, txt("c14c"));

    // botões que viram confete
    const r = rng(1414);
    const cores = [C.azulVivo, C.rosa, C.lilas, C.laranja, C.vinho, "#151314", "#fff"];
    const conf = E.reduzido ? [] : Array.from({ length: 18 }, () => {
      const g = S("g", {}, svg);
      const rr = 6 + r() * 7, cor = cores[Math.floor(r() * cores.length)];
      S("circle", { r: rr, fill: cor, stroke: "#111", "stroke-width": 1.2 }, g);
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([p, q]) => S("circle", { cx: p * rr * .3, cy: q * rr * .3, r: rr * .14, fill: "rgba(0,0,0,.45)" }, g));
      return { g, x: r() * 360, v: .05 + r() * .07, d: r() * 1800, rot: (r() - .5) * .3, sw: r() * 6 };
    });

    return {
      tocar(t) {
        const tq = q12(t);
        const desce = lerp(-200, 0, eo(fase(t, 0, 1600)));
        mao.setAttribute("transform", `translate(0 ${n1(desce)})`);
        chave.setAttribute("transform", `translate(0 ${n1(desce)}) rotate(${n1(Math.sin(tq / 900) * 3)} 181 150)`);
        escrever(fase(t, 1000, 3400));
        fios.forEach(({ p, L }) => (p.style.strokeDashoffset = L * (1 - eio(fase(t, 1200, 4000)))));
        ea(t - 3800);
        eb(t - 8400);
        ec(t - 12600);
        const fp = fase(t, 12000, 12900);
        poster.setAttribute("opacity", (1 - fp * .9).toFixed(3));
        a.style.opacity = b.style.opacity = (1 - fp * .85).toFixed(3);
        conf.forEach((k) => {
          const u = t - 13200 - k.d;
          if (u < 0) { k.g.setAttribute("opacity", 0); return; }
          k.g.setAttribute("opacity", 1 - fase(t, 19500, 20800));
          k.g.setAttribute("transform", `translate(${n1(k.x + Math.sin(u / 500 + k.sw) * 14)} ${n1(-20 + u * k.v)}) rotate(${n1(u * k.rot)})`);
        });
      },
    };
  },
});

// CENA 15 — Depois do fim (aberta)
CENAS.push({
  nome: "depois", dur: null, interativa: true, semProgresso: true, fundo: "#0E0E10",
  musica: { vol: .5, tom: "maior", glock: false, pad: true, reiniciar: true, rampa: 3 },
  sons: [[200, () => Som.rasgo(), true]],
  montar(raiz) {
    H("div", { class: "trama" }, raiz);
    const svg = arte(raiz, false);
    const r = rng(1515);
    const cores = [C.amarelo, "#8FA8F0", "#B6A9EE", C.rosa, "#F7F1E4"];
    const estrelas = Array.from({ length: 34 }, () => {
      const e = S("use", { href: "#estrela", x: -10, y: -10, width: 20, height: 20, color: cores[Math.floor(r() * cores.length)] }, svg);
      return { e, x: r() * 380 - 10, y: r() * 600 + 10, s: .3 + r() * .7, f: r() * 6 };
    });
    // a mão solta o botão e recua
    const livre = S("g", {}, svg);
    useBotao(livre, 140, 330, 72, "#0E0E10");
    const maoG = S("g", {}, svg);
    const mao = maoEsqueleto(maoG, 5);
    const gato = gatoEspia(svg, 30, 632, 8, "c15", 1.1, () => {
      Som.miau();
      if (E.gatos.size >= 5) Cartao.mostrar(txt("c15_gato"), undefined, true);
      else aviso(txt("aviso_gato", { G: E.gatos.size }));
    });
    gato.g.style.setProperty("--olho", C.amarelo);

    // 10 botões escondidos
    const POS = [[40, 128], [318, 98], [296, 236], [58, 300], [334, 372], [28, 468], [150, 150], [262, 508], [104, 560], [318, 604]];
    const achados = new Set();
    const bts = POS.map(([x, y], i) => {
      const g = S("g", { class: "toque" }, svg);
      S("circle", { r: 24, fill: "transparent" }, g);
      const anel = S("circle", { r: 15, fill: "none", stroke: C.amarelo, "stroke-width": 1.8, "stroke-dasharray": "3 3", opacity: 0 }, g);
      S("circle", { r: 16, fill: "url(#brilhoOuro)", opacity: .35 }, g);
      useBotao(g, 0, 0, 9 + (i % 3) * 2, "#8a7a5a");
      g.addEventListener("pointerup", (ev) => {
        ev.stopPropagation();
        Som.ding(i + 2);
        Cartao.mostrar(TEXTOS.botoes[i], undefined, true);
        if (!achados.has(i)) { achados.add(i); anel.setAttribute("opacity", 1); contar(); }
      });
      return { g, x, y, f: i * .7 };
    });

    const sob = sobre(raiz);
    const topo = H("div", { class: "t15-topo" }, sob);
    function contar() { topo.textContent = txt("c15_contador", { B: achados.size, G: E.gatos.size }); }
    contar();
    const env = H("button", { class: "t15-envelope", "aria-label": txt("c15_abrir") }, sob);
    const selo = S("svg", { class: "selo", viewBox: "-50 -50 100 100" }, env);
    S("circle", { r: 48, fill: C.vinho }, selo);
    [[-11, -11], [11, -11], [-11, 11], [11, 11]].forEach(([x, y]) => S("circle", { cx: x, cy: y, r: 7, fill: "#3d141d" }, selo));
    H("span", { class: "rotulo", txt: txt("c15_abrir") }, env);
    const rod = H("div", { class: "t15-rodape" }, sob);
    const denovo = H("button", { txt: txt("c15_denovo") }, rod);
    const gravar = H("button", { txt: txt("c15_gravar") }, rod);
    H("div", { class: "t15-credito", txt: txt("c15_credito") }, sob);

    // a carta
    const carta = H("div", { class: "carta", role: "dialog", "aria-label": "carta" }, raiz);
    const rolar = H("div", { class: "rolar" }, carta);
    const pars = TEXTOS.carta.map((p) => H("p", { class: p.tipo || "", txt: resolver(p.t) }, rolar));
    const fechar = H("button", { class: "fechar", "aria-label": txt("c15_fechar"), txt: "×" }, carta);
    let abertaEm = null;
    const abrir = () => { carta.classList.add("on"); abertaEm = E.relogio; rolar.scrollTop = 0; pars.forEach((p) => p.classList.remove("v")); Som.fio(); Cartao.esconder(); };
    env.addEventListener("click", (e) => { e.stopPropagation(); abrir(); });
    fechar.addEventListener("click", (e) => { e.stopPropagation(); carta.classList.remove("on"); abertaEm = null; });
    denovo.addEventListener("click", (e) => { e.stopPropagation(); recomecar(); });
    gravar.addEventListener("click", (e) => { e.stopPropagation(); location.href = location.pathname + "?gravar=1"; });

    let gatoDito = false;
    return {
      tocar(t) {
        const tq = q12(t);
        estrelas.forEach((s) => {
          const nasce = fase(t, 400 + s.f * 300, 900 + s.f * 300);
          s.e.setAttribute("transform", `translate(${n1(s.x)} ${n1(s.y)}) scale(${(s.s * nasce * (Math.sin(tq / 400 + s.f) > .3 ? 1 : .6)).toFixed(3)})`);
        });
        mao.atualizar(eio(fase(tq, 400, 1800)));
        maoG.setAttribute("transform", `translate(${n1(eio(fase(t, 1600, 3600)) * 340)} 0)`);
        livre.setAttribute("transform", `translate(${n1(Math.sin(t / 2600) * 10)} ${n1(Math.sin(t / 1900) * 12 - fase(t, 1600, 5000) * 40)}) rotate(${n1(t * .006)} 140 330)`);
        livre.setAttribute("opacity", 1 - fase(t, 4000, 6000) * .55);
        bts.forEach((b) => b.g.setAttribute("transform", `translate(${b.x} ${n1(b.y + Math.sin(t / 1300 + b.f) * 4)})`));
        env.style.setProperty("--s", eo(fase(t, 2600, 3400)).toFixed(3));
        topo.style.opacity = rod.style.opacity = fase(t, 3200, 4200);
        gato.tocar(t);
        if (t % 1000 < 20) contar();
        if (!gatoDito && E.gatos.size >= 5 && t > 4500) {
          gatoDito = true;
          Som.miau();
          Cartao.mostrar(txt("c15_gato"), undefined, true);
        }
        if (abertaEm !== null) {
          const u = E.relogio - abertaEm;
          pars.forEach((p, i) => { if (u > 600 + i * 900) p.classList.add("v"); });
          if (E.gravar && u > 3000) rolar.scrollTop += .6;
        }
        if (E.gravar && abertaEm === null && t > 5200 && !this.abriu) { this.abriu = true; abrir(); }
      },
      tap(ev) {
        // tocar no gato da cena 15 mostra o placar de gatos
        return false;
      },
    };
  },
});

</script>
</body>
</html>
