<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBE4EA">
<meta name="description" content="Uma surpresa de aniversário para a Loirinha. Embarque!">
<meta property="og:title" content="Feliz aniversário, Loirinha ✨">
<meta property="og:description" content="Seu cartão de embarque está pronto. ✈">
<title>Feliz aniversário, Loirinha ✨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23FBE4EA'/%3E%3Cpath d='M50 78C20 58 18 36 32 28c8-4 15 0 18 7 3-7 10-11 18-7 14 8 12 30-18 50z' fill='%23D9798F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/embarque.css">
<link rel="stylesheet" href="css/mapa.css">
<link rel="stylesheet" href="css/polaroid.css">
<link rel="stylesheet" href="css/sacolas.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header id="topo">
  <span class="marca" aria-hidden="true">✈ <span id="marca-nome"></span></span>
  <ol id="itinerario" aria-label="Itinerário da surpresa"></ol>
  <button id="btn-som" class="btn-redondo" type="button" aria-pressed="false" hidden></button>
</header>

<main id="conteudo" tabindex="-1">
  <section class="tela" id="embarque" aria-labelledby="embarque-h"></section>
  <section class="tela" id="mapa" aria-labelledby="mapa-h"></section>
  <section class="tela" id="polaroid" aria-labelledby="polaroid-h"></section>
  <section class="tela" id="sacolas" aria-labelledby="sacolas-h"></section>
  <section class="tela" id="penteadeira" aria-labelledby="penteadeira-h"></section>
  <section class="tela" id="final" aria-labelledby="final-h"></section>
</main>

<nav id="rodape" aria-label="Navegação entre as paradas">
  <button id="btn-voltar" class="btn btn-claro" type="button"></button>
  <button id="btn-proxima" class="btn" type="button"></button>
</nav>

<div id="balao" role="status" aria-live="polite"></div>
<canvas id="brilhos" aria-hidden="true"></canvas>

<script src="js/config.js"></script>
<script src="js/base.js"></script>
<script src="js/telas/embarque.js"></script>
<script src="js/telas/mapa.js"></script>
<script src="js/telas/polaroid.js"></script>
<script src="js/telas/sacolas.js"></script>
<script src="js/app.js"></script>
</body>
</html>
